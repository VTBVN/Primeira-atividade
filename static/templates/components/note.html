<li class="card note{favorite_class}">
  <a class="favorite-button" name="favorite_button" href="/favorite/{id}" aria-label="Favoritar">{favorite_symbol}</a>
  <h3>{title}</h3>
  <p>{details}</p>

  <div class="note-actions">
    <a class="edit-button" name="edit_button" href="/update/{id}">Editar</a>
    <a class="delete-button" name="delete_button" href="/delete/{id}">Excluir</a>
  </div>
</li>
